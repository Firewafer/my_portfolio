<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - S.M Rokon Uddin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-black p-4 md:p-8">

    <div class="max-w-5xl mx-auto space-y-8 relative">

        <!-- Navigation Bar (Sticky, Centered Icons) -->
        <nav class="sticky top-4 z-50 bg-white/90 backdrop-blur-md rounded-2xl p-4 flex justify-center items-center border border-gray-200 shadow-sm">
            <div class="flex space-x-16 text-gray-500">
                <!-- Home Link (Points back to index.html) -->
                <a href="index.html#home" class="hover:text-black transition-colors" title="Home">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                </a>
                <!-- About Link (Points back to index.html) -->
                <a href="index.html#about" class="hover:text-black transition-colors" title="About">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </a>
                <!-- Projects Link (Points back to index.html) -->
                <a href="index.html#projects" class="hover:text-black transition-colors" title="Projects">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                </a>
            </div>
        </nav>

        <!-- Contact Form Section -->
        <main class="bg-white rounded-3xl p-8 md:p-12 border border-gray-200 max-w-3xl mx-auto mt-12">
            <div class="mb-10 text-center">
                <h1 class="text-4xl md:text-5xl font-extrabold mb-4 tracking-tight">Let's Talk.</h1>
                <p class="text-gray-600 text-lg">Fill out the form below to discuss a project, collaboration, or just say hi.</p>
            </div>

            <!-- Form -->
            <form action="#" method="POST" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-bold text-black mb-2">Name</label>
                        <input type="text" id="name" name="name" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors" placeholder="Shams" required>
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-bold text-black mb-2">Email</label>
                        <input type="email" id="email" name="email" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors" placeholder="exmaple@example.com" required>
                    </div>
                </div>
                
                <div>
                    <label for="subject" class="block text-sm font-bold text-black mb-2">Subject</label>
                    <input type="text" id="subject" name="subject" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors" placeholder="Software Development Inquiry" required>
                </div>
                
                <div>
                    <label for="message" class="block text-sm font-bold text-black mb-2">Message</label>
                    <textarea id="message" name="message" rows="6" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3.5 focus:outline-none focus:border-black focus:ring-1 focus:ring-black transition-colors resize-none" placeholder="Tell me about your project..." required></textarea>
                </div>
                
                <button type="submit" class="w-full bg-black text-white px-6 py-4 rounded-xl font-bold flex justify-center items-center gap-2 hover:bg-gray-800 transition-colors border border-black">
                    Send Message
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </main>

        <!-- Prefer Email CTA Section -->
        <section class="bg-white rounded-3xl p-10 md:p-12 border border-gray-200 text-center max-w-3xl mx-auto">
            <h2 class="text-2xl md:text-3xl font-extrabold mb-4 tracking-tight">Prefer direct email?</h2>
            <p class="text-gray-600 text-lg mb-8">
                Skip the form and click the button to mail me directly.
            </p>
            <div class="flex justify-center">
                <!-- Mailto Link -->
                <a href="mailto:shawon1248@gmail.com" class="bg-white text-black px-8 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 border border-gray-300 hover:border-black hover:bg-gray-50 inline-flex transition-colors">
                    
                    <span>Email Me</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </a>
            </div>
        </section>

        <!-- Follow Me & Socials -->
        <section class="bg-white rounded-3xl p-6 md:p-8 border border-gray-200 flex flex-col sm:flex-row items-center justify-between gap-6 max-w-3xl mx-auto">
            <div class="flex items-center gap-2 text-gray-500 font-medium">
                <div class="w-2.5 h-2.5 bg-gray-400 rounded-full"></div>
                Follow Me
            </div>
            
            <div class="flex space-x-3">
               
                <!-- LinkedIn -->
                <a href="https://www.linkedin.com/in/smrus/" class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 hover:text-black hover:border-black transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                </a>
                <!-- GitHub -->
                <a href="https://github.com/Firewafer" target="_blank" class="w-12 h-12 rounded-full border border-gray-200 flex items-center justify-center text-gray-600 hover:bg-gray-50 hover:text-black hover:border-black transition-colors">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.161 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
                </a>
            </div>
        </section>

     
    </div>

</body>
</html>
